# Family Firm Branding in Transition — pilot configuration

run:
  run_id: null  # auto-generated UUID if null
  top_n: 5
  input_csv: data/input/family_firm_event_longlist_30_trimmed.csv
  output_dir: data/output
  interim_dir: data/interim
  reports_dir: reports

timepoints:
  relative:
    - pre_pre_event
    - pre_event
    - event
    - post_event
    - post_post_event
  year_offsets:
    pre_pre_event: -4
    pre_event: -2
    event: 0
    post_event: 2
    post_post_event: 4

snapshot_selection:
  target_date_strategy: mid_year
  target_month_day: "07-01"
  tolerance_days: 548
  prefer:
    - closest
    - earlier_on_tie
  allowed_status_codes:
    - "200"
  allowed_mimetypes:
    - text/html
  url_variants:
    - "https://www.{domain}/"
    - "http://www.{domain}/"
    - "https://{domain}/"
    - "http://{domain}/"
  event_year_precision_note: >
    Structured target_date_precision and event_date fields supersede this note.
    Year-level targets default to July 1 unless event_date metadata supplies month/day precision.
  event_dates_config: config/event_dates.yaml
  event_pre_window_days: 90
  adjacent_period_min_days: 180
  override_very_low_usable: false

crawl:
  mode: focused_site_crawl  # homepage_only | focused_site_crawl
  max_pages_per_snapshot: 25
  max_depth: 2
  timeout_seconds: 45
  retries: 5
  max_response_bytes: 10485760  # 10 MB
  strip_query_strings: false
  exclude_query_patterns:
    - "utm_"
    - "fbclid"
    - "gclid"
  user_agent: "FFB-WebMiner/0.1 (research; family-firm-branding-pilot; +https://github.com/)"
  throttle_seconds: 2.0
  extract_pdf: false
  prefer_german_paths: true
  branding_path_patterns:
    de:
      - "ueber-uns"
      - "über-uns"
      - "unternehmen"
      - "geschichte"
      - "historie"
      - "tradition"
      - "familie"
      - "werte"
      - "verantwortung"
      - "management"
      - "geschaeftsfuehrung"
      - "geschäftsführung"
      - "karriere"
      - "presse"
      - "news"
    en:
      - "about"
      - "company"
      - "history"
      - "heritage"
      - "family"
      - "values"
      - "responsibility"
      - "management"
      - "leadership"
      - "careers"
      - "press"
      - "news"

extract:
  methods:
    primary: trafilatura
    fallback: readability
  store_raw_html: true
  raw_html_dir: data/interim/html
  min_text_chars: 50

visual:
  enabled: true
  viewport_width: 1280
  viewport_height: 800
  screenshot_dir: data/interim/screenshots
  heading_rule: >
    Use first visible H1; if absent, use largest prominent hero heading
    (highest font-size among h1/h2 with visible text in main content area).

archive:
  cdx_api_url: "https://web.archive.org/cdx/search/cdx"
  cache_dir: data/interim/cdx
  retry_max: 5
  retry_backoff_base: 2.0

quality:
  max_temporal_distance_days: 548
  min_text_chars: 50
  manual_validation_sample_size: 15
