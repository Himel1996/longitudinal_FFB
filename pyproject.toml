[project]
name = "ffb-webminer"
version = "0.1.0"
description = "Longitudinal archived-web pipeline for family firm branding research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FFB Research Team" }]

dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "lingua-language-detector>=2.2,<3",
    "lxml>=5.2,<6",
    "pandas>=2.2,<3",
    "pyarrow>=16,<19",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dateutil>=2.9,<3",
    "pyyaml>=6,<7",
    "readability-lxml>=0.8,<1",
    "tenacity>=8.3,<10",
    "tldextract>=5.1,<6",
    "trafilatura>=1.9,<2",
]

[project.optional-dependencies]
visual = ["playwright>=1.44,<2"]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.4,<1",
]

[project.scripts]
ffb-webminer = "ffb_webminer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
